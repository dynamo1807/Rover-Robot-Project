name: Firmware-Aufgabe
description: Eine Aufgabe zu eingebetteter Software, Regelung, Tests oder Werkzeugen planen.
title: "[FW] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem und Ziel
    validations:
      required: true
  - type: textarea
    id: interfaces
    attributes:
      label: Schnittstellen und Randbedingungen
      description: Zeitverhalten, Einheiten, Hardwareannahmen und Abhängigkeiten angeben.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Abnahmekriterien
      placeholder: "- [ ] Messbares Verhalten oder Prüfergebnis"
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Prüfplan
      description: Host- und Zielsystemtests, Telemetrie und Fehlerinjektion beschreiben.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Sicherheitsauswirkung
      description: Angeben, wie sich Fehler auf die Aktuatorausgänge und den sicheren Zustand auswirken.
    validations:
      required: true
