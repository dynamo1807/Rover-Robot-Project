name: Fehlerbericht
description: Einen reproduzierbaren Fehler in Hardware, Firmware, Dokumentation oder Tests melden.
title: "[FEHLER] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Beobachtetes Problem
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Schritte zur Reproduktion
      placeholder: "1. Hardware-/Firmware-Revision\n2. Aufbau\n3. Aktion\n4. Beobachtung"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Nachweise
      description: Protokolle, Messungen, Bilder oder Oszilloskopaufnahmen ohne Geheimnisse oder personenbezogene Daten ergänzen.
  - type: dropdown
    id: safety
    attributes:
      label: Sicherheitsauswirkung
      options:
        - Keine bekannt
        - Bewegungs- oder Aktuatorrisiko
        - Elektrisches oder thermisches Risiko
        - Akkurisiko
        - Unbekannt; muss bewertet werden
    validations:
      required: true

