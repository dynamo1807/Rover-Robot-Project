name: Hardware-Aufgabe
description: Eine Aufgabe zu Elektronik, Platine, Stromversorgung oder Mechanik planen.
title: "[HW] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem und Ziel
      description: Das technische Problem und das gewünschte Ergebnis beschreiben.
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Eingaben und Abhängigkeiten
      description: Anforderungen, Entscheidungen, Datenblätter, Messungen und blockierende Issues verknüpfen.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Abnahmekriterien
      description: Messbare Kriterien als Markdown-Checkliste angeben.
      placeholder: "- [ ] Kriterium mit Wert und Einheit"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verifikation und Nachweise
      description: Erklären, welche Berechnung, Begutachtung, Inspektion oder Prüfung die Fertigstellung belegt.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Sicherheit und Fehlerarten
      description: Plausible Gefahren, Grenzwerte und Vorsichtsmaßnahmen benennen.
    validations:
      required: true
