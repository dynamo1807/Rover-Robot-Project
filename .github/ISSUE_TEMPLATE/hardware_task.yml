name: Hardware task
description: Plan an electronics, PCB, power, or mechanical engineering task.
title: "[HW] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and objective
      description: State the engineering problem and the desired outcome.
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs and dependencies
      description: Link requirements, decisions, datasheets, measurements, and blocking issues.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide measurable criteria using a Markdown checklist.
      placeholder: "- [ ] Criterion with value and unit"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and evidence
      description: Explain the calculation, review, inspection, or test that will prove completion.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and failure modes
      description: Identify credible hazards, limits, and precautions.
    validations:
      required: true

